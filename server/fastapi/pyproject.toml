[project]
name = "pipecat-quickstart"
version = "0.1.0"
description = "Quickstart example for building voice AI bots with Pipecat"
requires-python = ">=3.10"
dependencies = [
    # Capped below 1.8: it renames the TaskManager API this code builds
    # pipelines against, and every test in tests/ errors out on it. Lift the cap
    # in the same change that ports the pipeline, not before.
    "pipecat-ai[webrtc,websocket,silero,deepgram,openai,cartesia,google,grok,runner,openrouter,minimax,whisper,mlx-whisper,azure]>=1.7.0,<1.8",
    "pipecat-ai-cli",
    # world_context.py names its timezone; slim images may not ship zoneinfo.
    "tzdata",
    # session_content.py reads content/*.yaml. pipecat pulls it in today, but
    # this module imports it directly.
    "pyyaml",
    # mic_adpcm.py decodes the boards' ADPCM uplink with audioop, which left
    # the standard library in 3.13. The image runs 3.11 and has it built in.
    "audioop-lts; python_version >= '3.13'",
]

# This is an application, not a library, but the README installs it with
# `pip install -e .` so the local venv gets the dependencies above. Once
# `memory/` joined `models/` as a top-level package, setuptools' flat-layout
# autodiscovery refused to guess between them and the install failed outright.
# Naming them is what keeps that command working.
[tool.setuptools.packages.find]
include = ["memory*", "models*"]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The async tests are plain `async def test_...` with no marker. In the default
# strict mode pytest-asyncio skips them and pytest reports each as a failure
# ("async def functions are not natively supported") -- 60 of them, which read
# as broken code rather than a missing setting.
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I"]
