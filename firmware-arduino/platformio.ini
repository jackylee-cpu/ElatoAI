; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Two environments, one board. The default one is what you flash for normal use
; and for a release; `-localws` is the same firmware with the voice websocket
; pointed at your own machine -- see the "Local development" section in
; ../server/fastapi/README.md.
[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps = 
    bblanchon/ArduinoJson@^7.1.0
    links2004/WebSockets@^2.4.1
    ESP32Async/ESPAsyncWebServer@^3.7.6
    https://github.com/esp-arduino-libs/ESP32_Button.git#v0.0.1
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.0.1
    https://github.com/pschatzmann/arduino-libopus.git#a1.1.0
    olikraus/U8g2@^2.35.30

; This chip reports "Embedded PSRAM 8MB (AP_3v3)", which on the S3 is the octal
; variant, so flash stays QIO and PSRAM runs OPI. Without this the 60KB scratch
; block libopus allocates and the mbedTLS session buffers compete for the same
; ~278KB of internal RAM, and whichever asks second fails.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.filesystem = spiffs
board_build.partitions = partition.csv
upload_protocol = esptool

; NO -O2 FOR LIBOPUS. This was tried and measured on hardware 2026-09-11, and
; it made things slightly worse: Opus decode CPU was 7900us/packet at -O2
; against 7673us at -Os (n=19 and n=20 scheduler-suspended samples, 40ms
; frames), with the minimum sample going the same way, 7322us against 7234us.
; It also cost 13KB of flash.
;
; The likely reason is that this chip executes from flash through a cache, so
; -O2's larger code buys better instruction sequences and pays for them in
; cache misses. Code size *is* speed here. Do not "optimise" this back without
; re-measuring -- the Decode line in the per-turn log is the number to look at.
monitor_filters =
  esp32_exception_decoder
  time
build_unflags = 
    -std=gnu++11
    ; The board definition already sets USB mode 1; we override it below.
    -DARDUINO_USB_MODE=1

build_flags = 
    -std=gnu++17
    ; Level 5 printed several lines per websocket frame. At audio frame rates
    ; that is a lot of blocking CDC writes on the path that streams the mic.
    -D CORE_DEBUG_LEVEL=1
    ; DEBUG_ESP_PORT is what turns on arduinoWebSockets' per-frame [WS][0]
    ; logging. At audio frame rates that is several blocking CDC writes per
    ; packet on the same task that decodes audio, and it buries our own lines.
    ; Re-add it only when debugging the websocket layer itself.
    ; This board exposes only the ESP32-S3 native USB (no USB-UART bridge), so
    ; Serial must be the USB CDC port or nothing reaches the host.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Mode 0 = TinyUSB software CDC. Mode 1 shares the hardware USB-Serial-JTAG
    ; peripheral with the ROM, and that peripheral resets the chip into download
    ; mode whenever the host opens the port, which makes the app unobservable.
    -D ARDUINO_USB_MODE=0
    -D TOUCH_SENSOR_ENABLE=1        ; Enable touch sensor driver
    ; Pairs with board_build.arduino.memory_type above: selects the PSRAM-enabled
    ; libraries and lets the allocator place large blocks in external RAM.
    -D BOARD_HAS_PSRAM


; Local development: identical to the environment above except that the voice
; websocket goes to a FastAPI server on your LAN instead of the deployed one.
; Everything else (auth token, OTA, factory reset) still talks to the deployed
; backend, so the board keeps its pairing.
;
;   export AIBUDDY_DEV_WS_HOST=192.168.1.23   # your machine, not 127.0.0.1
;   pio run -e esp32-s3-devkitc-1-localws -t upload
;
; The board and the server must be on the same network, and the server has to
; listen on 0.0.0.0 for anything but the loopback to reach it.
[env:esp32-s3-devkitc-1-localws]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D LOCAL_WS_HOST=\"${sysenv.AIBUDDY_DEV_WS_HOST}\"
    -D LOCAL_WS_PORT=7860
    -D LOCAL_WS_PATH=\"/ws/esp32\"


; Speaker/amplifier self-test. Flash this when you need to know whether a noise
; is coming from the hardware or from everything upstream of it: it brings the
; radio down and drives the speaker from locally generated samples only, so a
; squeal that survives it cannot be the network, the Opus decoder or the
; playback pipeline. Flash the default environment again afterwards.
;
;   pio run -e esp32-s3-devkitc-1-audiotest -t upload
[env:esp32-s3-devkitc-1-audiotest]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D AUDIO_SELFTEST


; Diagnostic: identical to the default build with the boot sound suppressed.
; The squeal is consistently reported on the first TTS after boot, and the boot
; sound is what runs immediately before it -- installing and uninstalling the
; output I2S driver that audioStreamTask then reinstalls. Flash this, listen to
; the first TTS, and compare; flash the default environment to put it back.
[env:esp32-s3-devkitc-1-nochime]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D SKIP_BOOT_CHIME


; Diagnostic: the boot sound at a quarter of its level, everything else
; identical. Only the greeting -- the TTS immediately after the boot sound --
; squeals, and it squeals whether or not the sound owns its own I2S driver, so
; the sound itself is the variable rather than anything it does to the port. The
; remaining candidate is the supply: 2.8s of loud class-D output on a
; USB-powered rail shared with the ESP32, straight into the first TTS. If a
; quieter sound comes out clean, that is the answer; if it squeals just the
; same, the level is not the mechanism and this can be deleted.
[env:esp32-s3-devkitc-1-quietchime]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D CHIME_GAIN_OVERRIDE=0.12f


; Diagnostic A/B for the audio buffer placement: the PCM ring and the Opus
; decoder state go back to PSRAM, which is where
; CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096 sends every allocation over 4KB on
; its own. Flash this, note the `cpu` figure in the per-turn "Decode |" line,
; flash the default environment and compare.
;
; When this covered all three buffers (ring, state and libopus' 60KB scratch,
; ~98KB of internal RAM) the measured difference was 7900us against 8341us per
; packet -- 5.3%. The scratch has since gone back to PSRAM permanently on that
; evidence, so what this now measures is whether the remaining 38KB earns its
; keep.
[env:esp32-s3-devkitc-1-psrambufs]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D AUDIO_BUFFERS_IN_PSRAM

