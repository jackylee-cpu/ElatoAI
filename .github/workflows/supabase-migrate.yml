name: Apply Supabase migrations

# Schema first, image second. Both build workflows call this and gate on it, so
# a migration that fails means no new image gets published -- the alternative is
# the failure mode this repo already hit twice: new code on main, old columns in
# the database, and a 42703 in production.
#
# Callers must pass these secrets by name. `secrets: inherit` does not forward
# repository secrets on a personal GitHub account, which is why the first run
# linked `--project-ref ""` and died on a missing access token.
on:
  workflow_call:
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: false
      SUPABASE_DB_PASSWORD:
        required: false
      SUPABASE_PROJECT_REF:
        required: false
      NEXT_PUBLIC_SUPABASE_URL:
        required: false
  workflow_dispatch:

# A commit touching both frontend and server triggers both build workflows, and
# each calls this one. `db push` writes the migration history table, so two at
# once can interleave. Serialise instead of cancelling: a cancelled push can
# leave that history half written, which is worse than waiting.
concurrency:
  group: supabase-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      - name: Resolve credentials
        id: creds
        run: |
          ref="${SUPABASE_PROJECT_REF:-}"
          if [ -z "$ref" ] && [ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            ref="$(printf '%s\n' "$NEXT_PUBLIC_SUPABASE_URL" | sed -nE 's#https://([a-z0-9]+)\.supabase\.co.*#\1#p')"
          fi
          echo "project_ref=$ref" >> "$GITHUB_OUTPUT"

          missing=()
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "${SUPABASE_DB_PASSWORD:-}" ] && missing+=("SUPABASE_DB_PASSWORD")
          [ -z "$ref" ] && missing+=("SUPABASE_PROJECT_REF")

          if [ ${#missing[@]} -ne 0 ]; then
            echo "::warning::Skipping migrate; missing GitHub Actions secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions. Images will still publish."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.skipped != 'true'
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        if: steps.creds.outputs.skipped != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        if: steps.creds.outputs.skipped != 'true'
        run: supabase link --yes --project-ref "${{ steps.creds.outputs.project_ref }}"

      # Printed before and after so a failed run shows which migration stopped
      # it, and a successful one leaves a record of what actually got applied.
      - name: Pending migrations
        if: steps.creds.outputs.skipped != 'true'
        run: supabase migration list --linked

      - name: Push migrations
        if: steps.creds.outputs.skipped != 'true'
        run: supabase db push --linked --yes

      - name: Resulting state
        if: always() && steps.creds.outputs.skipped != 'true'
        run: supabase migration list --linked
